name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  # Public fixtures, pinned by commit and SHA-256. The 12.10 one is
  # also the packaged binary's smoke replay.
  PUBLIC_REPLAYS: https://raw.githubusercontent.com/michel-giehl/ValorantReplayParser/b51d67423b7b4952d59051cf91e55efa1c42da05/tests/Test.Integration/Replays
  FIXTURE_1210: 9f8b32c5-c243-41ec-bbbb-832582edf652.12_10.vrf
  FIXTURE_1210_SHA256: a4ce1b72f9bdf99492162013c1c909e6994a0d22bef1899e687fde71fbc86606

# The parser is developed on Windows (Oodle FFI, cp949 console); the Rust job
# runs there so the Oodle dependency always links.
jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.86.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: rustfmt
        run: cargo +1.86.0 fmt --check
      - name: clippy
        run: cargo +1.86.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Every crate with no default features, then with each feature alone, from
      # cargo metadata so a new feature is covered without editing a list.
      - name: core-only and singleton feature matrix
        shell: pwsh
        run: |
          $meta = cargo +1.86.0 metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = 0
          foreach ($pkg in $meta.packages) {
            $features = @($pkg.features.PSObject.Properties.Name | Where-Object { $_ })
            if ($features.Count -eq 0) { continue }
            foreach ($feature in @('') + @($features | Where-Object { $_ -ne 'default' } | Sort-Object)) {
              $cargoArgs = @('+1.86.0', 'check', '-p', $pkg.name, '--no-default-features', '--locked')
              if ($feature) { $cargoArgs += @('--features', $feature) }
              Write-Host "cargo $($cargoArgs -join ' ')"
              & cargo @cargoArgs
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $cases++
            }
          }
          Write-Host "feature matrix: $cases cases"
          if ($cases -eq 0) { Write-Error 'cargo metadata yielded no feature case'; exit 1 }
      - name: strict rustdoc
        run: cargo +1.86.0 doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Python interop dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: workspace tests and measured documentation
        run: python -W error tools/check_docs.py
      - name: core-only runtime tests
        run: cargo +1.86.0 test -p vrfkit --no-default-features --locked
      - name: container tests without the Oodle decoder
        run: cargo +1.86.0 test -p vrf-container --no-default-features --locked
      - name: Rust Parquet to PyArrow interoperability
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'vrfkit-python-interop'
          $env:VRFKIT_INTEROP_DIR = $root
          cargo +1.86.0 test -p vrf-export --test roundtrip write_interop_files --locked -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $interopDir = Join-Path $root 'interop'
          python -W error crates/vrf-export/tests/python_interop.py $interopDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Builds without a public fixture are covered by the private local audit.
      - name: corpus baselines on the public fixtures
        shell: pwsh
        run: |
          cargo +1.86.0 build -p vrfkit --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path (Get-Location) 'target/debug/vrfkit.exe'
          $fixtures = @(
            @("1210", $env:FIXTURE_1210, $env:FIXTURE_1210_SHA256),
            @("1211", "5c673443-5bdc-4576-b416-aab3f62471a5.12_11.vrf", "7a7a5492ddf286bb04413da96f0d3b216f91150e8174a3a4397493529e17ebdd"),
            @("1300", "12974d2b-848f-490d-80ba-5f03a033c2d5.13_00.vrf", "fd49091dd43171bb060eb6bbae50ed6677aa1077344572c5bf65f0c6fe2b4c1a")
          )
          foreach ($fixture in $fixtures) {
            $build, $name, $sha256 = $fixture
            $corpus = Join-Path $env:RUNNER_TEMP "baseline-corpora/build_$build"
            New-Item -ItemType Directory -Force $corpus | Out-Null
            $replay = Join-Path $corpus $name
            Invoke-WebRequest -UseBasicParsing -Uri "$env:PUBLIC_REPLAYS/$name" -OutFile $replay
            $actual = (Get-FileHash -Algorithm SHA256 $replay).Hash.ToLowerInvariant()
            if ($actual -ne $sha256) {
              Write-Error "fixture $name has SHA-256 $actual, expected $sha256"
              exit 1
            }
            python -W error tools/check_corpus_baseline.py --baseline "tools/baselines/build_$build.json" --corpus $corpus --exe $exe --require-input
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # The local audit's strict main/checkpoint gate: export success cannot hide array/leaf errors.
          python -W error tools/verify_build_corpus.py --exe $exe --corpus (Join-Path $env:RUNNER_TEMP 'baseline-corpora') --work-dir (Join-Path $env:RUNNER_TEMP 'public-fixture-audit') --output (Join-Path $env:RUNNER_TEMP 'public-fixture-report.json') --jobs 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # An independent decoder: every fixture identity observed, every value equal.
          python -W error tools/validate_type_evidence.py (Join-Path $env:RUNNER_TEMP 'public-fixture-audit') tools/fixtures/public_fixture_type_evidence.json --compare-typed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: retain public replay verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-replay-verification
          path: |
            ${{ runner.temp }}/public-fixture-report.json
            ${{ runner.temp }}/public-fixture-audit/*/result.json
            ${{ runner.temp }}/public-fixture-audit/*/type-evidence.json
            ${{ runner.temp }}/public-fixture-audit/*/*.log
            ${{ runner.temp }}/public-fixture-audit/*/error.txt
          retention-days: 14
          if-no-files-found: warn

  python-checks:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      # Install Arrow and NumPy before discovery so dependency-bearing test
      # modules are exercised along with the standard-library-only modules.
      - name: python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: ASCII guard
        run: python -W error tools/check_ascii.py --check
      - name: overlay corrections
        run: python -W error tools/apply_type_corrections.py --check
      - name: generated checksum guard
        run: python -W error tools/extract_checksum_types.py --export tools/fixtures/checksum_export --check
      - name: generated scoped type guard
        run: python -W error tools/generate_scoped_types.py --check
      - name: baseline schemas
        run: python -W error tools/check_baseline_schemas.py
      - name: docs self-check
        run: python -W error tools/check_docs.py --fast
      # These checks use committed fixtures and do not require Oodle.
      - name: tools test suite
        run: python -W error -m unittest discover -b -s tools/tests -p "test_*.py"

  rust-stable:
    name: Rust stable / all features
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: all-feature runtime tests
        run: cargo +stable test --workspace --all-features --locked
      - name: core-only runtime tests
        run: cargo +stable test -p vrfkit --no-default-features --locked

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: validate workflow syntax, expressions and shell scripts
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$archive"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  windows-package:
    name: Windows release package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.86.0'
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: windows-release-x64
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: build and test the optimized Windows CLI
        shell: pwsh
        run: |
          cargo +1.86.0 build --release --target x86_64-pc-windows-msvc --locked -p vrfkit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.86.0 test --release --target x86_64-pc-windows-msvc --locked -p vrfkit -p vrf-movement
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: package and run the extracted executable
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v0.0.0-ci.$env:GITHUB_SHA" }
          $dist = Join-Path $env:RUNNER_TEMP 'release-dist'
          python -W error tools/package_release.py create --exe target/x86_64-pc-windows-msvc/release/vrfkit.exe --directory $dist --tag $tag --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath (Join-Path $dist "vrfkit-$tag-windows-x64.zip") -DestinationPath (Join-Path $env:RUNNER_TEMP 'release-extracted')
      - name: verify a public replay with the packaged binary
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $corpus = Join-Path $env:RUNNER_TEMP 'release-corpus'
          New-Item -ItemType Directory $corpus | Out-Null
          $replay = Join-Path $corpus 'public-12.10.vrf'
          Invoke-WebRequest -Uri "$env:PUBLIC_REPLAYS/$env:FIXTURE_1210" -OutFile $replay
          if ((Get-FileHash -Algorithm SHA256 $replay).Hash.ToLowerInvariant() -ne $env:FIXTURE_1210_SHA256) { throw 'Public replay checksum mismatch' }
          python -W error tools/verify_build_corpus.py --exe (Join-Path $env:RUNNER_TEMP 'release-extracted/vrfkit.exe') --corpus $corpus --work-dir (Join-Path $env:RUNNER_TEMP 'release-audit') --output (Join-Path $env:RUNNER_TEMP 'release-report.json') --jobs 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: retain packaged-binary verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-replay-verification
          path: |
            ${{ runner.temp }}/release-report.json
            ${{ runner.temp }}/release-audit/*/result.json
            ${{ runner.temp }}/release-audit/*/type-evidence.json
            ${{ runner.temp }}/release-audit/*/*.log
            ${{ runner.temp }}/release-audit/*/error.txt
          retention-days: 14
          if-no-files-found: warn
      - name: retain the verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            ${{ runner.temp }}/release-dist/*.zip
            ${{ runner.temp }}/release-dist/*.sha256
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  ci-complete:
    name: CI complete
    needs: [rust, rust-stable, python-checks, workflow-lint, windows-package]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require every test job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['JOB_RESULTS'])
          failures = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          print(failures or 'All required CI jobs passed')
          sys.exit(bool(failures) or not results)
          PY
