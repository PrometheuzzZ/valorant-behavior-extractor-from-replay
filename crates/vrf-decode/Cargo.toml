[package]
name = "vrf-decode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Type-aware field decoders for Unreal Engine replay primitives"

[dependencies]
vrf-bitio = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
vrf-testkit = { workspace = true }

# Four independent decoders over the always-compiled core, all on by default;
# the crate docs (src/lib.rs, "Feature flags") describe each.
[features]
default = ["array", "effect", "overlay", "structs"]
array = []
effect = []
overlay = []
structs = []
